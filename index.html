<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Projects - Portfolio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <h1 class="hero-title">Engineering Projects</h1>
            <p class="hero-description">
                Explore my journey through innovative electrical engineering solutions, from IoT systems to power
                electronics and smart grid technologies.
            </p>
            <div class="hero-stats">
                <span class="stat">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span id="project-count">6</span> Projects
                </span>
                <span>•</span>
                <span>2022 - 2024</span>
            </div>
        </div>
    </section>

    <div class="container">
        <!-- Featured Projects -->
        <section class="section">
            <h2 class="section-title">
                <span class="title-accent"></span>
                Featured Projects
            </h2>
            <div class="featured-grid" id="featured-projects">
                <!-- Featured projects will be inserted here by JavaScript -->
            </div>
        </section>

        <!-- All Projects -->
        <section class="section">
            <h2 class="section-title">
                <span class="title-accent purple"></span>
                All Projects
            </h2>
            <div class="projects-grid" id="all-projects">
                <!-- All projects will be inserted here by JavaScript -->
            </div>
        </section>
    </div>

    <!-- Project Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <button class="modal-close" id="modal-close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-content" id="modal-content">
                <!-- Modal content will be inserted here by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="back-to-top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5,12 12,5 19,12"></polyline>
        </svg>
    </button>

    <script src="js/projects-data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
